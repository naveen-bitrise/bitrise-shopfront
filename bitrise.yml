format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

# Shopfront CI for the self-healing release eval.
#   pr                 -> typecheck + unit tests on every PR to main (LLM risk review step added later)
#   ios_simulator      -> release-config simulator build that fetches updates from the Staging deployment
#   android_emulator   -> release APK for emulators, same deployment
#   codepush_publish     -> PR labelled `release-update`: optional CodePush update (app offers it in a drawer)
#   codepush_publish_fix -> PR labelled `release-fix`: mandatory CodePush update (installs + restarts, no prompt)
#                           Both use the Bitrise CodePush Publish Step and publish to $CODEPUSH_DEPLOYMENT
#
# Secrets (Bitrise > App settings > Secrets):
#   BITRISE_API_TOKEN (used by the codepush_publish* workflows)
# The app's CodePush deployment keys (Staging) live in app.json; they are not secrets.

app:
  envs:
  # Release Management app IDs (iOS and Android)
  - IOS_CONNECTED_APP_ID: bd299984-2f7a-4834-a0b1-9e966738a7a0
  - ANDROID_CONNECTED_APP_ID: 1e5daf83-2d1f-427e-8d86-a60f69639702
  # Deployment that new updates are published to (same name exists on both apps)
  - CODEPUSH_DEPLOYMENT: Staging
  # Native binary versions that receive the update; keep in sync with app.json `expo.version`
  - APP_TARGET_VERSIONS: 1.0.0

meta:
  bitrise.io:
    stack: osx-xcode-16.4.x
    machine_type_id: g2.mac.medium

step_bundles:
  install:
    steps:
    - git-clone@8: {}
    - restore-npm-cache@2: {}
    - script@1:
        title: npm ci
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            npm ci
    - save-npm-cache@1: {}
  publish:
    # Publishes the iOS and Android CodePush updates to $CODEPUSH_DEPLOYMENT.
    # $CODEPUSH_MANDATORY is set by the calling workflow.
    steps:
    - bundle::install: {}
    - codepush-publish@1:
        title: Publish iOS update
        inputs:
        - platform: ios
        - app_id: $IOS_CONNECTED_APP_ID
        - deployment: $CODEPUSH_DEPLOYMENT
        - app_version: $APP_TARGET_VERSIONS
        - api_token: $BITRISE_API_TOKEN
        - description: "$BITRISE_GIT_MESSAGE"
        - mandatory: $CODEPUSH_MANDATORY
        - skip_dependency_install: "true"
    - codepush-publish@1:
        title: Publish Android update
        inputs:
        - platform: android
        - app_id: $ANDROID_CONNECTED_APP_ID
        - deployment: $CODEPUSH_DEPLOYMENT
        - app_version: $APP_TARGET_VERSIONS
        - api_token: $BITRISE_API_TOKEN
        - description: "$BITRISE_GIT_MESSAGE"
        - mandatory: $CODEPUSH_MANDATORY
        - skip_dependency_install: "true"
    - deploy-to-bitrise-io@2: {}

workflows:
  pr:
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    steps:
    - bundle::install: {}
    - script@1:
        title: Typecheck and unit tests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            npm run ci
    triggers:
      pull_request:
      - target_branch: main

  ios_simulator:
    steps:
    - bundle::install: {}
    - script@1:
        title: Expo prebuild (iOS)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            npx expo prebuild --platform ios --no-install
    - restore-cocoapods-cache@2: {}
    - cocoapods-install@2:
        inputs:
        - source_root_path: ios
    - save-cocoapods-cache@1: {}
    - xcode-build-for-simulator@3:
        inputs:
        - project_path: ios/Shopfront.xcworkspace
        - scheme: Shopfront
        - configuration: Release
        - xcodebuild_options: |-
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
    - deploy-to-bitrise-io@2: {}

  android_emulator:
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.large
    steps:
    - bundle::install: {}
    - script@1:
        title: Expo prebuild (Android)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            npx expo prebuild --platform android --no-install
    - android-build@1:
        inputs:
        - project_location: $BITRISE_SOURCE_DIR/android
        - module: app
        - variant: release
    - deploy-to-bitrise-io@2: {}

  codepush_publish:
    # Optional update (features): the app offers it in a drawer ("Update now" / "Later").
    # Runs when a PR to main gets the `release-update` label (publishes the PR's code), or manually.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    envs:
    - CODEPUSH_MANDATORY: "false"
    steps:
    - bundle::publish: {}
    triggers:
      pull_request:
      - target_branch: main
        label: release-update

  codepush_publish_fix:
    # Mandatory update (self-healing fixes): the app installs it and restarts without asking.
    # Runs when a PR to main gets the `release-fix` label, or manually.
    meta:
      bitrise.io:
        stack: ubuntu-noble-24.04-bitrise-2025-android
        machine_type_id: g2.linux.medium
    envs:
    - CODEPUSH_MANDATORY: "true"
    steps:
    - bundle::publish: {}
    triggers:
      pull_request:
      - target_branch: main
        label: release-fix
